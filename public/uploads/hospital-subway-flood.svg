<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" />
  <rect x="0" y="240" width="600" height="160" fill="url(#water)" />
  <!-- Road and Subway ramp -->
  <polygon points="120,220 480,220 540,400 60,400" fill="#334155" opacity="0.6" />
  <rect x="250" y="160" width="100" height="70" rx="6" fill="#dc2626" opacity="0.85" />
  <text x="300" y="200" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="20" text-anchor="middle">AMBULANCE</text>
  <!-- Water ripples -->
  <path d="M 0 250 Q 150 235, 300 250 T 600 250" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.7" />
  <path d="M 0 280 Q 150 265, 300 280 T 600 280" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
  <circle cx="530" cy="50" r="30" fill="#ef4444" opacity="0.2" />
  <text x="530" y="56" fill="#ef4444" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">CRITICAL</text>
  <text x="30" y="60" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="22">General Hospital ER Ramp Inundation</text>
  <text x="30" y="90" fill="#94a3b8" font-family="sans-serif" font-size="14">Water Depth: Submerged (1.2m) • Culvert Overcapacity</text>
</svg>
